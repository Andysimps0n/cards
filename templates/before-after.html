<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/base.css">
<script src="assets/crayon.js"></script>
<style>
  /* Before/After: 위아래 2단 비교. .shot 안에 실제 결과 스크린샷 <img> 를 넣어 사용 */
  .quest-tag .badge { width: 96px; height: 96px; } .quest-tag .qname { font-size: 34px; }
  h1 { margin-top: 52px; font-size: 80px; }
  .row { margin-top: 44px; display: grid; grid-template-columns: 300px 1fr; gap: 36px; align-items: center; }
  .row .card { padding: 26px; height: 390px; }
  .shot { width: 100%; height: 100%; border-radius: 20px; background: var(--paper-warm); display: flex; align-items: center;
    justify-content: center; font-family: var(--f-hand); font-weight: 700; font-size: 30px; color: var(--ink-faint); overflow: hidden; }
  .shot img { width: 100%; height: 100%; object-fit: cover; }
  .side .tag { font-family: var(--f-mono); font-weight: 800; font-size: 28px; letter-spacing: .1em; }
  .side .say { margin-top: 12px; font-family: var(--f-display); font-size: 42px; line-height: 1.3; }
  .side .why { margin-top: 12px; font-size: 30px; line-height: 1.5; color: var(--ink-soft); font-weight: 500; }
  .before .tag { color: var(--ink-soft); } .after .tag { color: var(--p-deep); }
  .before .card::before { border-color: var(--ink-faint); }
  .arrow { left: 150px; top: 830px; width: 110px; height: 90px; transform: rotate(90deg); }
</style></head>
<body data-series="talk">
<div class="post">
  <div class="quest-tag"><div class="badge" data-badge></div>
    <div class="meta"><span class="qno">QUEST #<span data-no>01</span></span><span class="qname" data-series-name></span></div></div>
  <h1 class="display" data-field="title">같은 요청, <span class="hl">다른 결과</span></h1>

  <div class="row before">
    <div class="side"><div class="tag">BEFORE</div><div class="say" data-field="before-say">"예쁘게<br>해줘"</div>
      <div class="why" data-field="before-why">기준이 없어서<br>무난하게 나와요</div></div>
    <div class="card"><div class="shot" data-field="before-img">결과 스크린샷 자리</div></div>
  </div>
  <div class="row after">
    <div class="side"><div class="tag">AFTER</div><div class="say" data-field="after-say">용어 5개<br>넣어서 요청</div>
      <div class="why" data-field="after-why">원하는 방향이<br>또렷해져요</div></div>
    <div class="card"><div class="shot" data-field="after-img">결과 스크린샷 자리</div></div>
  </div>
  <div class="footer"><span data-field="handle">@crayon.sure</span><span class="pg" data-field="pg">08 / 09</span></div>
</div>
</body></html>
